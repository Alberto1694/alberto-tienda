<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>

<section class="container py-4">
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <img th:src="${producto.rutaImagen}" th:alt="${producto.descripcion}" class="img-fluid"
                         style="max-height: 420px; object-fit: contain;"/>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="mb-3" th:text="${producto.descripcion}">Producto</h2>
                    <p class="text-muted" th:text="${producto.detalle}">Detalle</p>
                    <h3 class="text-success mt-2" th:text="${#numbers.formatCurrency(producto.precio)}">$0.00</h3>
                    <p class="mb-3">
                        <span class="badge bg-success" th:if="${producto.existencias > 0}"
                              th:text="${producto.existencias} + ' unidades disponibles'"></span>
                        <span class="badge bg-danger" th:unless="${producto.existencias > 0}">Agotado</span>
                    </p>

                    <div class="mt-auto d-flex gap-2">
                        <a th:href="@{/}" class="btn btn-outline-secondary">Volver</a>
                        <form th:action="@{/carrito/agregar}" method="post" class="d-inline">
                            <input type="hidden" name="idProducto" th:value="${producto.idProducto}"/>
                            <button type="submit" class="btn btn-primary" th:disabled="${producto.existencias == 0}"
                                    onclick="addCart(this.form); return false;">
                                <i class="fas fa-cart-plus"></i> Agregar al carrito
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section th:replace="~{general/fragmentos :: mostrarToast}"></section>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
