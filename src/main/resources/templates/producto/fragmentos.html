<!-- Fragmento para agregar producto -->
<section th:fragment="agregar" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Productos</h2>
            <button type="button" class="btn btn-primary" sec:authorize="hasRole('ROLE_ADMIN')"
                    data-bs-toggle="modal" data-bs-target="#agregarProductoModal">
                <i class="fa-solid fa-plus"></i> Agregar
            </button>
        </div>
    </div>

    <div class="modal fade" id="agregarProductoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title"><i class="fa-solid fa-box"></i> Nuevo producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action='@{/producto/guardar}' class='was-validated' enctype="multipart/form-data" method="post">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Categoria</label>
                                <select name="idCategoria" class="form-select" required="true">
                                    <option value="" selected disabled>Seleccione...</option>
                                    <option th:each="categoria : ${categorias}" th:value="${categoria.idCategoria}"
                                            th:text="${categoria.descripcion}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Descripcion</label>
                                <input type="text" name="descripcion" class="form-control" required="true"/>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Detalle</label>
                                <textarea name="detalle" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Precio</label>
                                <input type="number" step="0.01" name="precio" class="form-control" required="true"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Existencias</label>
                                <input type="number" name="existencias" class="form-control" required="true"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Activo</label>
                                <div class="form-check">
                                    <input type="checkbox" name="activo" class="form-check-input"/>
                                    <label class="form-check-label">Si</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Imagen</label>
                                <input type="file" name="imagenFile" onchange='mostrarImagen(this);' class="form-control"/>
                                <img id='blah' src='#' alt='imagen de producto' height="200"/>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Fragmento para listado de productos -->
<section th:fragment="listado" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <div class="container">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descripcion</th>
                        <th>Precio</th>
                        <th>Existencias</th>
                        <th>Activo</th>
                        <th>Imagen</th>
                        <th class="text-end" sec:authorize="hasRole('ROLE_ADMIN')">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.idProducto}"></td>
                        <td th:text="${producto.descripcion}"></td>
                        <td th:text="${producto.precio}"></td>
                        <td th:text="${producto.existencias}"></td>
                        <td>
                            <span class="badge" th:classappend="${producto.activo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${producto.activo} ? 'Si' : 'No'"></span>
                        </td>
                        <td>
                            <img th:if="${producto.rutaImagen}" th:src="${producto.rutaImagen}" alt="imagen"
                                 style="max-height:60px;"/>
                        </td>
                        <td class="text-end" sec:authorize="hasRole('ROLE_ADMIN')">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/producto/modificar/{id}(id=${producto.idProducto})}">
                                <i class="fa-solid fa-pen"></i>
                            </a>
                            <button class="btn btn-outline-danger btn-sm" data-bs-toggle="modal" data-bs-target="#confirmModal"
                                    th:attr="data-bs-id=${producto.idProducto},data-bs-descripcion=${producto.descripcion}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <p class="text-muted">Total: <span th:text="${totalProductos}">0</span></p>
    </div>
</section>

<!-- Fragmento para confirmar eliminacion -->
<section th:fragment="confirmarEliminar">
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar eliminacion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action='@{/producto/eliminar}' method="post">
                    <div class="modal-body">
                        <input type="hidden" name="idProducto" id="modalId"/>
                        <p>Seguro que desea eliminar el producto <strong id="modalDescripcion"></strong>?</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Fragmento para editar producto -->
<section th:fragment="editar">
    <div class="container mt-4">
        <h2>Editar producto</h2>
        <form th:action='@{/producto/guardar}' method="post" enctype="multipart/form-data" class="mt-3">
            <input type="hidden" name="idProducto" th:value="${producto.idProducto}"/>
            <input type="hidden" name="rutaImagen" th:value="${producto.rutaImagen}"/>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Categoria</label>
                    <select name="idCategoria" class="form-select" required="true">
                        <option th:each="categoria : ${categorias}" th:value="${categoria.idCategoria}"
                                th:selected="${categoria.idCategoria == producto.idCategoria}"
                                th:text="${categoria.descripcion}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Descripcion</label>
                    <input type="text" name="descripcion" class="form-control" required="true"
                           th:value="${producto.descripcion}"/>
                </div>
                <div class="col-12">
                    <label class="form-label">Detalle</label>
                    <textarea name="detalle" class="form-control" rows="3" th:text="${producto.detalle}"></textarea>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Precio</label>
                    <input type="number" step="0.01" name="precio" class="form-control" required="true"
                           th:value="${producto.precio}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Existencias</label>
                    <input type="number" name="existencias" class="form-control" required="true"
                           th:value="${producto.existencias}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Activo</label>
                    <div class="form-check">
                        <input type="checkbox" name="activo" class="form-check-input" th:checked="${producto.activo}"/>
                        <label class="form-check-label">Si</label>
                    </div>
                </div>
                <div class="col-12">
                    <label class="form-label">Imagen</label>
                    <input type="file" name="imagenFile" onchange='mostrarImagen(this);' class="form-control"/>
                    <img id='blah' th:if="${producto.rutaImagen}" th:src="${producto.rutaImagen}" alt='imagen de producto' height="200"/>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/producto/listado}">Volver</a>
            </div>
        </form>
    </div>
</section>
