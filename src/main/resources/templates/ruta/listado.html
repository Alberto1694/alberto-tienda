<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>

<section class="container py-4">
    <div class="row">
        <div class="col-md-10">
            <div class="card p-2">
                <div class="card-header"><h4>Listado de Rutas</h4></div>
                <div class="card-body">
                    <div th:if="${rutas != null and !rutas.empty}">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Ruta</th>
                                    <th>Requiere Rol</th>
                                    <th>Rol</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="r : ${rutas}">
                                    <td>[[${r.idRuta}]]</td>
                                    <td>[[${r.ruta}]]</td>
                                    <td>[[${r.requiereRol} ? 'Si' : 'No']]</td>
                                    <td>[[${r.rol != null ? r.rol.rol : 'Publica'}]]</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2" th:if="${rutas == null or rutas.empty}">
                        <span>No hay rutas para mostrar.</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="card text-center bg-success text-white mb-3">
                <div class="card-body"><h3>Total</h3>
                    <h4 class="fs-2"><i class="fas fa-layer-group"></i> [[${totalRutas}]]</h4>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
