<!-- Fragmento para agregar categoria -->
<section th:fragment="agregar" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Categorias</h2>
            <button type="button" class="btn btn-primary" sec:authorize="hasRole('ROLE_ADMIN')"
                    data-bs-toggle="modal" data-bs-target="#agregarCategoriaModal">
                <i class="fa-solid fa-plus"></i> Agregar
            </button>
        </div>
    </div>

    <div class="modal fade" id="agregarCategoriaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title"><i class="fa-solid fa-layer-group"></i> Nueva categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action='@{/categoria/guardar}' class='was-validated' enctype="multipart/form-data" method="post">
                    <div class="modal-body">
                        <div class='mb-3'>
                            <label class="form-label">Descripcion</label>
                            <input type="text" name="descripcion" class='form-control' required="true"/>
                        </div>
                        <div class='mb-3'>
                            <label class="form-label">Activo</label>
                            <input type="checkbox" name='activo' class='form-check-input'/>
                        </div>
                        <div class='mb-3'>
                            <label class="form-label">Imagen</label>
                            <input type="file" name='imagenFile' onchange='mostrarImagen(this);' class='form-control'/>
                            <img id='blah' src='#' alt='imagen de categoria' height="200"/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> Cerrar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Fragmento para listado de categorias -->
<section th:fragment="listado">
    <div class="container">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descripcion</th>
                        <th>Activo</th>
                        <th>Imagen</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="categoria : ${categorias}">
                        <td th:text="${categoria.idCategoria}"></td>
                        <td th:text="${categoria.descripcion}"></td>
                        <td>
                            <span class="badge" th:classappend="${categoria.activo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${categoria.activo} ? 'Si' : 'No'"></span>
                        </td>
                        <td>
                            <img th:if="${categoria.rutaImagen}" th:src="${categoria.rutaImagen}" alt="imagen"
                                 style="max-height:60px;"/>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/categoria/modificar/{id}(id=${categoria.idCategoria})}">
                                <i class="fa-solid fa-pen"></i>
                            </a>
                            <button class="btn btn-outline-danger btn-sm" data-bs-toggle="modal" data-bs-target="#confirmModal"
                                    th:attr="data-bs-id=${categoria.idCategoria},data-bs-descripcion=${categoria.descripcion}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <p class="text-muted">Total: <span th:text="${totalCategorias}">0</span></p>
    </div>
</section>

<!-- Fragmento para confirmar eliminacion -->
<section th:fragment="confirmarEliminar">
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar eliminacion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action='@{/categoria/eliminar}' method="post">
                    <div class="modal-body">
                        <input type="hidden" name="idCategoria" id="modalId"/>
                        <p>Seguro que desea eliminar la categoria <strong id="modalDescripcion"></strong>?</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Fragmento para editar categoria -->
<section th:fragment="editar">
    <div class="container mt-4">
        <h2>Editar categoria</h2>
        <form th:action='@{/categoria/guardar}' method="post" enctype="multipart/form-data" class="mt-3">
            <input type="hidden" name="idCategoria" th:value="${categoria.idCategoria}"/>
            <div class='mb-3'>
                <label class="form-label">Descripcion</label>
                <input type="text" name="descripcion" class='form-control' required="true" th:value="${categoria.descripcion}"/>
            </div>
            <div class='mb-3'>
                <label class="form-label">Activo</label>
                <input type="checkbox" name='activo' class='form-check-input' th:checked="${categoria.activo}"/>
            </div>
            <div class='mb-3'>
                <label class="form-label">Imagen</label>
                <input type="file" name='imagenFile' onchange='mostrarImagen(this);' class='form-control'/>
                <img id='blah' th:if="${categoria.rutaImagen}" th:src="${categoria.rutaImagen}" alt='imagen de categoria' height="200"/>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/categoria/listado}">Volver</a>
        </form>
    </div>
</section>
